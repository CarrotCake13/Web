<body class="contact-page">
    <h1>Welcome to the RE2R Wiki contact page</h1>
    <div class="contact-content">
        <div class="contact-list">
            <div class="contact-item">
                <img src="Website Files/discord.png" alt="Discord">
                <span>Placeholder</span>
            </div>
            <div class="contact-item">
                <img src="Website Files/facebook.png" alt="Facebook">
                <span>Placeholder</span>
            </div>
            <div class="contact-item">
                <img src="Website Files/gmail.png" alt="Gmail">
                <span>Placeholder</span>
            </div>
            <div class="contact-item">
                <img src="Website Files/instagram.png" alt="Instagram">
                <span>Placeholder</span>
            </div>
            <div class="contact-item">
                <img src="Website Files/twitter.png" alt="Twitter">
                <span>Placeholder</span>
            </div>
        </div>
        <form class="feedback-form">
            <h2>Feedback Form</h2>
            <label for="first-name">First Name</label>
            <input id="first-name" name="first-name" type="text">

            <label for="last-name">Last Name</label>
            <input id="last-name" name="last-name" type="text">

            <label for="phone-number">Phone Number</label>
            <input id="phone-number" name="phone-number" type="tel">

            <label for="details">Details</label>
            <textarea id="details" name="details" rows="5"></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
